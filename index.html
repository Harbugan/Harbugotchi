<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d2b53">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Harbugotchi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Harbugotchi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header>
    <div id="title"><b id="nameLabel">HARBUGOTCHI</b><small id="stageLabel"></small></div>
    <button id="soundBtn" class="icon-btn" aria-label="Lyd til/fra">ON</button>
  </header>

  <section id="stats" aria-label="Status">
    <div class="stat" data-k="hunger"><i data-ic="fish" data-s="2"></i><div class="bar"></div></div>
    <div class="stat" data-k="happy"><i data-ic="heart" data-s="2"></i><div class="bar"></div></div>
    <div class="stat" data-k="energy"><i data-ic="bolt" data-s="2"></i><div class="bar"></div></div>
    <div class="stat" data-k="clean"><i data-ic="bubbles" data-s="2"></i><div class="bar"></div></div>
  </section>

  <section id="scene">
    <canvas id="bgCv" class="px"></canvas>
    <div id="bubbles"></div>
    <div id="poops"></div>

    <div id="crabWrap" data-stage="egg">
      <div id="crabSlide">
        <div id="crabBox">
          <div id="alert" hidden></div>
          <canvas id="crabCv" class="px" aria-label="Krabbe"></canvas>
        </div>
      </div>
    </div>

    <div id="say" role="status"></div>
    <div id="fx"></div>
    <div id="night" aria-hidden="true"><i class="moon" data-ic="moon" data-s="5"></i><i class="zzz" data-ic="zed" data-s="4"></i><i class="zzz z2" data-ic="zed" data-s="6"></i><i class="zzz z3" data-ic="zed" data-s="3"></i></div>
    <div id="flash"></div>
  </section>

  <nav id="actions">
    <button data-act="feed"><i data-ic="fish"></i>MAD</button>
    <button data-act="cuddle"><i data-ic="heart"></i>KÆL</button>
    <button data-act="play"><i data-ic="balloon"></i>LEG</button>
    <button data-act="sleep" id="sleepBtn"><i data-ic="moon"></i><span>SOV</span></button>
    <button data-act="scold"><i data-ic="bang"></i>STRAF</button>
    <button data-act="clean"><i data-ic="bubbles"></i>VASK</button>
    <button data-act="medicine"><i data-ic="pill"></i>PILLE</button>
    <button data-act="info"><i data-ic="info"></i>INFO</button>
  </nav>

  <div class="sheet" id="foodSheet" hidden>
    <div class="card">
      <h2>HVAD SKAL DEN HAVE?</h2>
      <div class="choices">
        <button data-food="meal"><i data-ic="fish" data-s="5"></i>FISK<small>mætter</small></button>
        <button data-food="snack"><i data-ic="candy" data-s="5"></i>SLIK<small>usundt</small></button>
      </div>
      <button class="ghost" data-close>LUK</button>
    </div>
  </div>

  <div class="sheet" id="infoSheet" hidden>
    <div class="card">
      <h2 id="infoTitle">INFO</h2>
      <dl id="infoList"></dl>
      <button class="ghost danger" id="resetBtn">START FORFRA</button>
      <button class="ghost" data-close>LUK</button>
    </div>
  </div>

  <div class="sheet" id="nameSheet" hidden>
    <form class="card" id="nameForm">
      <h2>DEN KLÆKKES!</h2>
      <p>Hvad skal din krabbe hedde?</p>
      <input id="nameInput" maxlength="10" placeholder="KRABBI" autocomplete="off">
      <button type="submit" class="primary">GIV NAVN</button>
    </form>
  </div>

  <div id="game" hidden>
    <div id="gameBar"><span>FANG BOBLER!</span><b id="gameScore">0</b><b id="gameTime">15</b></div>
    <div id="gameField"></div>
  </div>
</main>
<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
